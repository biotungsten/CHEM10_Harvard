[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CHEM10_Harvard"
version = "0.0.1"
dependencies = [
  "numpy >= 2.4.2",
  "telemetrix >= 1.4.6",
  "jupyter >= 1.1.1",
  "ipykernel >= 7.2.0"
]
requires-python = ">=3.13"
authors = [
  {name = "David Sauer"},
  {name = "Austin Wang"},
  {name = "Mara Casabeer"}
]
description = "Package to interface with the spectrometer built as a part of CHEM10 at Harvard College."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov",
]

dev = [
  "pytest>=8",
  "pytest-cov",
  "build",
  "twine",
]

[project.urls]
Repository = "https://github.com/biotungsten/CHEM10_Harvard.git"
Issues = "https://github.com/biotungsten/CHEM10_Harvard/issues"


[tool.hatch.build.targets.wheel]
packages = ["src/CHEM10_Harvard"]

[tool.pytest.ini_options]
addopts = [
    "-m not physical and not environment",
]
markers = [
    "physical: marks tests that need a physical setup",
    "environment: marks tests that verify the environment setup"
]